name: Build site

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild generated HTML
        run: python3 tools/build_site.py
      - name: Check generated files are committed
        run: git diff --exit-code
